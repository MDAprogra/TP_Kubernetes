name: CI/CD

on:
  push:
    branches: [ master ]

permissions:
  contents: read

env:
  IMAGE_BACKEND: docker.io/${{ secrets.DOCKERHUB_USER }}/webapp-backend
  IMAGE_FRONTEND: docker.io/${{ secrets.DOCKERHUB_USER }}/webapp-frontend

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Login Docker Hub
      run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USER }}" --password-stdin
    - name: Build & push backend
      run: |
        docker buildx create --use
        docker buildx build \
          --platform linux/amd64,linux/arm64 \
          -t ${{ env.IMAGE_BACKEND }}:${{ github.sha }} \
          --push ./backend

  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Login Docker Hub
      run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USER }}" --password-stdin
    - name: Build & push frontend
      run: |
        docker buildx create --use
        docker buildx build \
          --platform linux/amd64,linux/arm64 \
          -t ${{ env.IMAGE_FRONTEND }}:${{ github.sha }} \
          --push ./frontend

  helm-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Helm
      run: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
    - name: Lint
      run: |
        helm lint webapp-chart
        helm template webapp-chart --values webapp-chart/values.yaml > /tmp/rendered.yaml
        wc -l /tmp/rendered.yaml

  deploy:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, helm-lint]
    steps:
    - uses: actions/checkout@v4
    - name: Install Helm
      run: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
    - name: Setup kubeconfig
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
        chmod 600 ~/.kube/config
    - name: Deploy
      run: |
        helm upgrade --install gb webapp-chart \
          --namespace guestbook \
          --values webapp-chart/values.yaml \
          --set global.registry=docker.io/${{ secrets.DOCKERHUB_USER }} \
          --set backend.tag=${{ github.sha }} \
          --set frontend.tag=${{ github.sha }} \
          --wait --timeout 5m